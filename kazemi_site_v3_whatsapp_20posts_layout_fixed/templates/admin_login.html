<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | پیمانکاری کاظمی</title><style>
*{box-sizing:border-box}body{margin:0;background:#101510;color:#f5f1e8;font-family:Tahoma,Arial;display:grid;place-items:center;min-height:100vh;padding:20px}.box{width:min(420px,100%);background:#1b211b;border:1px solid #424334;padding:32px;border-radius:18px}h1{font-size:24px;color:#d5b56a}p{color:#b8b7aa;line-height:1.9}label{display:block;margin:18px 0 8px}input{width:100%;padding:13px;border-radius:8px;border:1px solid #555;background:#101510;color:white}button{width:100%;margin-top:22px;padding:14px;background:#c8a65b;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.msg{color:#ffb1a8}
</style></head><body><form class="box" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><h1>پنل مدیریت کاظمی</h1><p>برای مدیریت نمونه‌کارها، اطلاعات شرکت و پیام مشتریان وارد شوید.</p>{% with items=get_flashed_messages() %}{% for m in items %}<p class="msg">{{m}}</p>{% endfor %}{% endwith %}<label>نام کاربری</label><input name="username" required autocomplete="username"><label>رمز عبور</label><input type="password" name="password" required autocomplete="current-password"><button>ورود به پنل</button></form></body></html>
