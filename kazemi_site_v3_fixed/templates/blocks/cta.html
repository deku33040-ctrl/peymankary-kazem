<section class="section custom-block cta-block bg-{{ d.bg }} align-center" id="block-{{ b.id }}"><h2 class="reveal">{{ d.title }}</h2>{% if d.text %}<p class="reveal">{{ d.text|nl2br }}</p>{% endif %}{% if d.button_text %}<a class="button gold reveal" href="{{ d.button_link or '#contact' }}"{% if d.button_link.startswith('http') %} target="_blank" rel="noopener"{% endif %}>{{ d.button_text }}</a>{% endif %}</section>
