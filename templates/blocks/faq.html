<section class="section custom-block faq-block bg-{{ d.bg }}" id="block-{{ b.id }}">{% if d.title %}<h2 class="reveal">{{ d.title }}</h2>{% endif %}<div class="faq-list">{% for line in d['items'].split('\n') if '|' in line %}{% set parts = line.split('|', 1) %}<details class="reveal"><summary>{{ parts[0].strip() }}</summary><p>{{ parts[1].strip() }}</p></details>{% endfor %}</div></section>
