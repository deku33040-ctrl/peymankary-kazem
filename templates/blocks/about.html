<section class="intro section" id="about"{% if settings.about_bg_image %} style="background-image:linear-gradient(#e9e6dcee,#e9e6dcee),url('{{ settings.about_bg_image }}');background-size:cover;background-position:center"{% endif %}>
  <div class="section-label reveal">{{ d.label }}</div>
  <div class="intro-layout"><h2 class="reveal">{{ d.title|rich }}</h2><div class="intro-copy reveal"><p>{{ settings.aboutText|nl2br }}</p>{% if d.link_text %}<a class="inline-link" href="#contact">{{ d.link_text }} <span></span></a>{% endif %}</div></div>
</section>
